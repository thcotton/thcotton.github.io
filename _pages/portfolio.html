{% for post in site.portfolio %}
<details>
  <summary>
    <strong>{{ post.title }}</strong>
    {% if post.status %}
      — {{ post.status }}
    {% endif %}
  </summary>

  <p>{{ post.excerpt }}</p>

  {% if post.paperurl %}
    <p><a href="{{ post.paperurl }}">View Paper</a></p>
  {% endif %}
</details>

<br>
{% endfor %}
